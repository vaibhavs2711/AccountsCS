<!-- Change Password Modal -->
<div class="modal-overlay" id="changePasswordModal" style="display: none; align-items: center; justify-content: center;">
    <div class="modal-content" style="max-width: 440px; padding: 26px 28px; border-radius: 12px; background: #ffffff; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04); position: relative;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div style="font-size: 1.15rem; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Change Password
            </div>
            <span style="cursor: pointer; font-size: 1.3rem; color: #94a3b8; line-height: 1; padding: 4px;" onclick="closeChangePasswordModal()" onmouseover="this.style.color='#0f172a'" onmouseout="this.style.color='#94a3b8'">✕</span>
        </div>

        <div id="cp-error-msg" style="display: none; padding: 10px 14px; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 6px; font-size: 0.85rem; margin-bottom: 16px; font-weight: 500;"></div>
        <div id="cp-success-msg" style="display: none; padding: 10px 14px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; border-radius: 6px; font-size: 0.85rem; margin-bottom: 16px; font-weight: 500;"></div>

        <form id="change-password-form" onsubmit="submitChangePassword(event)">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" id="cp_csrf_token">
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #334155;">New Password</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="cp_new_password" name="new_password" class="form-control" required placeholder="Minimum 6 characters" minlength="6" style="width: 100%; padding-right: 40px; font-size: 0.9rem;">
                    <span onclick="togglePwdVisibility('cp_new_password', this)" style="position: absolute; right: 12px; cursor: pointer; color: #94a3b8; display: flex; align-items: center;" title="Toggle visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>
            </div>

            <div style="margin-bottom: 22px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #334155;">Confirm New Password</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="cp_confirm_password" name="confirm_password" class="form-control" required placeholder="Re-enter new password" minlength="6" style="width: 100%; padding-right: 40px; font-size: 0.9rem;">
                    <span onclick="togglePwdVisibility('cp_confirm_password', this)" style="position: absolute; right: 12px; cursor: pointer; color: #94a3b8; display: flex; align-items: center;" title="Toggle visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" class="btn" onclick="closeChangePasswordModal()" style="background: #f1f5f9; color: #475569; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer;">Cancel</button>
                <button type="submit" id="cp_submit_btn" class="btn" style="background: #0f172a; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; font-weight: 600; cursor: pointer;">Update Password</button>
            </div>
        </form>
    </div>
</div>

<script>
function openChangePasswordModal() {
    var modal = document.getElementById('changePasswordModal');
    var form = document.getElementById('change-password-form');
    var errorBox = document.getElementById('cp-error-msg');
    var successBox = document.getElementById('cp-success-msg');
    if (form) form.reset();
    if (errorBox) errorBox.style.display = 'none';
    if (successBox) successBox.style.display = 'none';
    if (modal) {
        modal.classList.add('open');
        modal.style.display = 'flex';
        setTimeout(function() {
            var inp = document.getElementById('cp_new_password');
            if (inp) inp.focus();
        }, 100);
    }
}

function closeChangePasswordModal() {
    var modal = document.getElementById('changePasswordModal');
    if (modal) {
        modal.classList.remove('open');
        modal.style.display = 'none';
    }
}

function togglePwdVisibility(inputId, iconEl) {
    var input = document.getElementById(inputId);
    if (!input) return;
    if (input.type === 'password') {
        input.type = 'text';
        if (iconEl) iconEl.style.color = '#0284c7';
    } else {
        input.type = 'password';
        if (iconEl) iconEl.style.color = '#94a3b8';
    }
}

function submitChangePassword(event) {
    event.preventDefault();
    var newPwd = document.getElementById('cp_new_password').value;
    var confPwd = document.getElementById('cp_confirm_password').value;
    var errorBox = document.getElementById('cp-error-msg');
    var successBox = document.getElementById('cp-success-msg');
    var submitBtn = document.getElementById('cp_submit_btn');

    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    if (newPwd !== confPwd) {
        errorBox.innerText = 'New passwords do not match.';
        errorBox.style.display = 'block';
        return;
    }

    if (newPwd.length < 6) {
        errorBox.innerText = 'New password must be at least 6 characters long.';
        errorBox.style.display = 'block';
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = 'Updating...';

    var formData = new FormData();
    formData.append('new_password', newPwd);
    formData.append('csrf_token', document.getElementById('cp_csrf_token').value);

    fetch("{{ url_for('employee_change_password') }}", {
        method: 'POST',
        body: formData
    })
    .then(function(res) {
        return res.json().then(function(data) {
            return { ok: res.ok, data: data };
        });
    })
    .then(function(result) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Update Password';

        if (!result.ok || !result.data.success) {
            errorBox.innerText = (result.data && result.data.error) ? result.data.error : 'Failed to update password.';
            errorBox.style.display = 'block';
        } else {
            successBox.innerText = result.data.message || 'Password updated successfully!';
            successBox.style.display = 'block';
            document.getElementById('change-password-form').reset();
            setTimeout(function() {
                closeChangePasswordModal();
            }, 1500);
        }
    })
    .catch(function(err) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Update Password';
        errorBox.innerText = 'Network error occurred. Please try again.';
        errorBox.style.display = 'block';
    });
}

// Close when clicking modal backdrop
window.addEventListener('click', function(e) {
    var modal = document.getElementById('changePasswordModal');
    if (modal && e.target === modal) {
        closeChangePasswordModal();
    }
});
</script>
