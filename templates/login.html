{% extends "base.html" %}

{% block title %}Sign In — Cityscope Accounts{% endblock %}

{% block body %}
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #0f172a;
        background-image: radial-gradient(circle at top left, #1e293b, #0f172a 70%);
        padding: 24px;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
    }
    .login-container::after {
        content: "";
        position: absolute;
        bottom: 0;
        right: 0;
        width: 100%;
        height: 50%;
        background: radial-gradient(circle at bottom right, rgba(37,99,235,0.15) 0%, transparent 60%);
        pointer-events: none;
    }
    .login-card {
        background: white;
        border-radius: 20px;
        padding: 48px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
        z-index: 10;
    }
    .login-card-logo {
        width: 56px;
        height: 56px;
        background-color: #eff6ff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2563eb;
        margin: 0 auto 16px auto;
    }
    .login-card-brand {
        text-align: center;
        font-size: 1.8rem;
        font-weight: 800;
        color: #0f172a;
        margin-bottom: 4px;
    }
    .login-card-brand span {
        color: #2563eb;
    }
    .login-card-sub {
        text-align: center;
        font-size: 0.85rem;
        color: #64748b;
        margin-bottom: 32px;
    }
    .login-card h2 {
        text-align: center;
        font-size: 1.5rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 8px;
    }
    .login-card p.subtitle {
        text-align: center;
        font-size: 0.9rem;
        color: #64748b;
        margin-bottom: 32px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 8px;
    }
    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }
    .input-wrapper svg {
        position: absolute;
        left: 14px;
        color: #94a3b8;
    }
    .input-wrapper input {
        width: 100%;
        padding: 12px 16px 12px 40px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
    }
    .input-wrapper input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .input-wrapper .eye-icon {
        left: auto;
        right: 14px;
        cursor: pointer;
    }
    .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        font-size: 0.85rem;
    }
    .form-options label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #475569;
        font-weight: 500;
        cursor: pointer;
    }
    .form-options input[type="checkbox"] {
        accent-color: #2563eb;
        width: 16px;
        height: 16px;
    }
    .form-options a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
    }
    .form-options a:hover {
        text-decoration: underline;
    }
    .btn-submit {
        width: 100%;
        padding: 14px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        transition: background-color 0.2s;
    }
    .btn-submit:hover {
        background-color: #1d4ed8;
    }
    .secure-badge {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        font-weight: 500;
        color: #64748b;
        margin-top: 32px;
    }
    .alert-error {
        background-color: #fef2f2;
        color: #b91c1c;
        padding: 12px;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-bottom: 24px;
        border: 1px solid #fecaca;
        text-align: center;
    }

    @media (max-width: 576px) {
        .login-card {
            padding: 32px 24px;
        }
    }
</style>

<div class="login-container">
    <div class="login-card">
        <div class="login-card-brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Cityscope Logo" style="height: 60px; object-fit: contain; margin-bottom: 10px;">
        </div>
        <div class="login-card-sub">Accounts &amp; Commission System</div>

        <h2>Welcome Back!</h2>
        <p class="subtitle">Sign in to continue to your dashboard</p>

        {% if error %}
        <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <input type="email" id="email" name="email" placeholder="you@cityscope.in" required value="{{ request.form.get('email', '') }}">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <!-- Eye Icon -->
                    <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" onclick="togglePassword()"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-submit">
                Sign In
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>

        <div class="secure-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 12 11 14 15 10"></polyline></svg>
            Secure access. Every time.
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const pwd = document.getElementById('password');
    if(pwd.type === 'password') {
        pwd.type = 'text';
    } else {
        pwd.type = 'password';
    }
}
</script>
{% endblock %}
