name: CI/CD Pipeline - Deploy to Zima Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: 🔍 Build & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax Check
        run: |
          python -m py_compile app.py auth.py config.py models.py seed.py

  deploy:
    name: 🚀 Deploy to Zima Server
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Deploy on Zima Server
        run: |
          APP_DIR=""
          if [ -d "/DATA/apps/AccountsCS" ]; then
            APP_DIR="/DATA/apps/AccountsCS"
          elif [ -d "$HOME/apps/AccountsCS" ]; then
            APP_DIR="$HOME/apps/AccountsCS"
          fi

          if [ -n "$APP_DIR" ]; then
            echo "Deploying in $APP_DIR..."
            cd "$APP_DIR"
            git pull origin main
            sudo DOCKER_CONFIG=/tmp/.docker docker compose up -d --build --remove-orphans
            sudo docker image prune -f
            sudo DOCKER_CONFIG=/tmp/.docker docker compose ps
          else
            echo "Error: AccountsCS directory not found on ZimaOS!"
            exit 1
          fi

