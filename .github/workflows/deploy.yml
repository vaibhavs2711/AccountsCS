name: CI/CD Pipeline - Deploy to Zima Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: 🔍 Build & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax Check
        run: |
          python -m py_compile app.py auth.py config.py models.py seed.py

  deploy:
    name: 🚀 Deploy to Zima Server
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment File
        run: |
          # If .env does not exist in workspace, create it from secrets or existing configuration
          if [ ! -f .env ]; then
            if [ -n "${{ secrets.TUNNEL_TOKEN }}" ]; then
              echo "TUNNEL_TOKEN=${{ secrets.TUNNEL_TOKEN }}" > .env
              echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
              echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
            elif [ -f /DATA/AppData/AccountsCS/.env ]; then
              cp /DATA/AppData/AccountsCS/.env .env
            elif [ -f ~/.AccountsCS.env ]; then
              cp ~/.AccountsCS.env .env
            fi
          fi

      - name: Build & Restart Docker Compose
        run: |
          docker compose up -d --build --remove-orphans

      - name: Cleanup Unused Docker Images
        run: |
          docker image prune -f

      - name: Check Container Status
        run: |
          docker compose ps

