services:
  app:
    build: .
    container_name: cityscope-app
    restart: always
    ports:
      - "5005:5000"
    environment:
      - TZ=Asia/Kolkata
      - MYSQL_HOST=${MYSQL_HOST:-db}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cityscope-secure-db-pass}
      - MYSQL_DB=${MYSQL_DB:-cityscope_accounts}
      - SECRET_KEY=${SECRET_KEY:-cityscope-secret-key-change-in-production-2024}
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: cityscope-db
    restart: always
    environment:
      - TZ=Asia/Kolkata
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-cityscope-secure-db-pass}
      - MYSQL_DATABASE=${MYSQL_DB:-cityscope_accounts}
    volumes:
      - mysql_data:/var/lib/mysql

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cityscope-cloudflare-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  mysql_data:
