version: '3.8'

services:
  app:
    build: .
    container_name: cityscope-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=cityscope-secure-db-pass
      - MYSQL_DB=cityscope_accounts
      - SECRET_KEY=cityscope-secret-key-change-in-production-2024
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: cityscope-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=cityscope-secure-db-pass
      - MYSQL_DATABASE=cityscope_accounts
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cityscope-cloudflare-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  mysql_data:
